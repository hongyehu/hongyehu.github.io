- title: 研究亮点
  type: time_table
  contents:
    - title: Ansatz-free Hamiltonian learning with Heisenberg-limited scaling
      institution: PRX Quantum 6, 040315 (2025)
      year: Quantum Learning
      description:
        - 提出无需先验相互作用结构假设的哈密顿量学习算法，仅使用黑盒实时演化查询和最少数字控制即可达到海森堡极限标度。
        - Featured in an APS Physics Viewpoint, “Quantum systems modeled without prior assumptions”; selected as a long talk at AQIS 2025.
    - title: Demonstration of robust and efficient quantum property learning with shallow shadows
      institution: Nature Communications 16, 2943 (2025)
      year: Quantum Learning
      description:
        - 研究浅层阴影协议中的噪声影响，提出由贝叶斯学习驱动的抗噪声浅层阴影方法，并在超导量子设备上展示抗噪声 classical shadows。
        - Featured by Phys.org, Quantum China, Science Magazine, UC San Diego Today, Interesting Engineering Newsletter and Japanese Tech News.
    - title: Efficiently measuring d-wave pairing and beyond in quantum gas microscopes
      institution: Physical Review Letters 135, 123402 (2025)
      year: Analog Quantum<br>Simulation
      description:
        - 提出在费米量子气体显微镜中测量长程超导配对关联等广泛可观测量的协议，仅需全局控制和位点分辨粒子数测量。
        - Featured on Physics World as a research highlight for understanding superconductivity.
    - title: Universal Dynamics with Globally Controlled Analog Quantum Simulators
      institution: arXiv:2508.19075 (2025), Nature Physics Under Review
      year: Analog Quantum<br>Simulation
      description:
        - 建立仅用全局控制场实现通用量子动力学的框架，引入 direct quantum optimal control，并在 Rydberg 原子阵列上工程化非原生相互作用和拓扑动力学。
    - title: Large-scale quantum reservoir learning with an analog quantum computer
      institution: arXiv:2407.02553 (2024), PRX Intelligence Under Review
      year: Quantum Learning
      description:
        - 提出可扩展的无梯度量子 reservoir learning 算法，并在中性原子模拟量子计算机上展示最高 108 qubits 的大规模量子机器学习实验。
        - Featured by Quantum Insider News and QuEra News.

